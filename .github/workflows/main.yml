name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          GRADLEW=$(find . -name gradlew -not -path './.git/*' | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "HITTAR INTE gradlew - filen kom inte med i uppladdningen"
            ls -R | head -50
            exit 1
          fi
          cd "$(dirname "$GRADLEW")"
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: castlegates-mod
          path: '**/build/libs/castlegates-*.jar'
